<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carnê Tríade Conexão - Reforço Escolar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --azul: #1e3a8a;
    --azul-claro: #dbeafe;
    --azul-medio: #3b82f6;
    --verde: #10b981;
    --amarelo: #fbbf24;
    --vermelho: #ef4444;
    --cinza: #64748b;
    --cinza-claro: #f1f5f9;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    padding: 20px 10px;
    min-height: 100vh;
  }

  /* Barra de ações (não aparece na impressão) */
  .barra-acoes {
    max-width: 210mm;
    margin: 0 auto 16px;
    padding: 12px 18px;
    background: #fff;
    border-left: 4px solid var(--azul-medio);
    border-radius: 8px;
    box-shadow: 0 4px 12px rgba(30,58,138,.08);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13.5px;
    color: #1e293b;
  }
  .barra-acoes .icone { flex-shrink: 0; color: var(--azul); }
  .barra-acoes strong { color: var(--azul); }
  .barra-acoes .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .18s;
  }
  .barra-acoes .btn-imprimir { background: var(--azul); color: #fff; }
  .barra-acoes .btn-imprimir:hover { background: #172554; }
  .barra-acoes .btn-voltar { background: #e2e8f0; color: #1e293b; }
  .barra-acoes .btn-voltar:hover { background: #cbd5e1; }
  .barra-acoes .grupo { margin-left: auto; display: flex; gap: 8px; }

  /* ===== FOLHA A4 ===== */
  .folha {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 20px;
    background: #fff;
    padding: 6mm 5mm;
    display: flex;
    flex-direction: column;
    gap: 3mm;
    box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15);
    border-radius: 8px;
  }

  /* ===== CARNÊ ===== */
  .carne {
    display: flex;
    height: 44mm;
    page-break-inside: avoid;
    font-size: 9px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(30, 58, 138, 0.12);
    border: 1px solid #cbd5e1;
    background: #fff;
    position: relative;
  }

  .carne::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #1e3a8a, #3b82f6, #60a5fa);
  }

  /* ===== CANHOTO ===== */
  .canhoto {
    width: 32%;
    padding: 8px 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
    border-right: 2px dashed #94a3b8;
    position: relative;
  }

  .canhoto::after {
    content: "";
    position: absolute;
    right: -6px;
    top: 50%;
    width: 10px;
    height: 10px;
    background: #fff;
    border: 1px solid #94a3b8;
    border-radius: 50%;
    transform: translateY(-50%);
  }

  .canhoto .topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 9px;
    color: var(--azul);
    padding-bottom: 3px;
    border-bottom: 1.5px solid var(--azul-claro);
    margin-bottom: 2px;
  }

  .canhoto .topo .badge {
    background: var(--azul);
    color: #fff;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 8px;
    letter-spacing: .3px;
  }

  .canhoto .campo {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 1;
  }

  .canhoto .campo label {
    font-size: 7.5px;
    color: var(--cinza);
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .canhoto .campo .linha {
    border-bottom: 1px dotted #94a3b8;
    height: 11px;
  }

  .canhoto .data-linha {
    display: flex;
    gap: 3px;
    align-items: flex-end;
  }

  .canhoto .data-linha .linha {
    flex: 1;
    border-bottom: 1px dotted #94a3b8;
    height: 11px;
  }

  /* ===== VIA PRINCIPAL ===== */
  .via {
    width: 68%;
    padding: 8px 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #fff;
  }

  .via .cabecalho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 4px;
    margin-bottom: 2px;
    border-bottom: 1.5px solid var(--azul-claro);
  }

  .via .titulo {
    font-weight: 800;
    font-size: 11px;
    color: var(--azul);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .via .titulo svg { color: var(--azul-medio); flex-shrink: 0; }

  .via .parcela-tag {
    font-weight: 700;
    font-size: 9px;
    color: #fff;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
  }

  .via .corpo {
    display: flex;
    gap: 8px;
    flex: 1;
  }

  .via .col-esq {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .via .col-dir {
    width: 38%;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .via .campo {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .via .campo label {
    font-size: 7.5px;
    font-weight: 700;
    color: var(--cinza);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .via .campo .linha {
    border-bottom: 1px dotted #94a3b8;
    height: 12px;
  }

  .via .campo .valor-preenchido {
    font-size: 9.5px;
    font-weight: 700;
    color: #1e293b;
    padding: 1px 0 2px;
    border-bottom: 1px dotted #94a3b8;
    min-height: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Caixas destacadas */
  .via .caixa {
    border: 1.5px solid var(--azul-claro);
    border-radius: 6px;
    padding: 4px 6px;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    position: relative;
  }

  .via .caixa.destaque {
    border-color: var(--verde);
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
  }

  .via .caixa label {
    font-size: 7.5px;
    font-weight: 800;
    color: var(--azul);
    letter-spacing: 0.3px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .via .caixa.destaque label {
    color: #047857;
  }

  .via .caixa label svg { flex-shrink: 0; }

  .via .caixa .valor-preenchido {
    font-size: 10px;
    font-weight: 800;
    color: #1e293b;
    border-bottom: 1px dotted #64748b;
    padding: 1px 0;
    margin-top: 2px;
    min-height: 13px;
  }

  .via .caixa.destaque .valor-preenchido {
    color: #047857;
    font-size: 11px;
  }

  .via .caixa .linha {
    border-bottom: 1px dotted #64748b;
    height: 11px;
    margin-top: 2px;
  }

  .via .caixa .data {
    display: flex;
    gap: 3px;
    margin-top: 2px;
    align-items: center;
  }

  .via .caixa .data .linha {
    flex: 1;
    margin-top: 0;
  }

  .via .caixa .data span {
    color: var(--cinza);
    font-weight: 700;
  }

  /* Linha recebido */
  .via .recebido {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    font-size: 8.5px;
    margin-top: auto;
    padding-top: 3px;
  }

  .via .recebido .label {
    font-weight: 700;
    color: var(--cinza);
    white-space: nowrap;
  }

  .via .recebido .linha {
    flex: 1;
    border-bottom: 1px dotted #94a3b8;
    height: 11px;
  }

  .via .recebido .check {
    background: var(--verde);
    color: #fff;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 8px;
    font-weight: 700;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .via .recebido .check svg { flex-shrink: 0; }

  /* Aviso */
  .via .aviso {
    font-size: 7.5px;
    color: #92400e;
    background: #fef3c7;
    padding: 3px 6px;
    border-radius: 4px;
    border-left: 3px solid var(--amarelo);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }

  .via .aviso svg { flex-shrink: 0; color: #b45309; }

  /* ===== IMPRESSÃO ===== */
  @media print {
    body {
      background: #fff;
      padding: 0;
    }
    .barra-acoes { display: none !important; }
    .folha {
      margin: 0;
      box-shadow: none;
      border-radius: 0;
      padding: 5mm;
      min-height: auto;
      page-break-after: always;
    }
    .folha:last-child { page-break-after: auto; }
    .carne { box-shadow: none; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>

<!-- Barra de ações (não imprime) -->
<div class="barra-acoes" id="barraAcoes">
  <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
    <line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="8" y1="2" x2="8" y2="6"/>
    <line x1="3" y1="10" x2="21" y2="10"/>
  </svg>
  <div>
    <strong id="infoAluno">Carregando…</strong>
    <div id="infoSub" style="font-size:12px;color:#64748b;margin-top:2px;"></div>
  </div>
  <div class="grupo">
    <button class="btn btn-voltar" onclick="window.close()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Fechar
    </button>
    <button class="btn btn-imprimir" onclick="window.print()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Imprimir
    </button>
  </div>
</div>

<!-- Container das folhas -->
<div id="paginas"></div>

<!-- Fallback: se o JS falhar, mostra mensagem -->
<noscript>
  <div style="max-width:210mm;margin:20px auto;padding:20px;background:#fee2e2;color:#991b1b;border-radius:8px;">
    JavaScript está desativado. Ative para gerar o carnê.
  </div>
</noscript>

<script>
/* ============================================================
   CARNÊ — geração dinâmica a partir do localStorage
   ============================================================ */

// ---------- Compatibilidade com o DB do admin ----------
// Se estiver rodando sozinho (sem db.js), criamos um stub que lê direto do localStorage
function lerDB(entidade) {
  try {
    const raw = localStorage.getItem('triade_' + entidade);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Erro ao ler', entidade, e);
    return [];
  }
}

function fmtMoeda(v) {
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
}

// ---------- Ícones SVG ----------
const ICONE_ESCOLA = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>`;
const ICONE_CALENDARIO = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
const ICONE_DINHEIRO = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`;
const ICONE_CHECK = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const ICONE_INFO = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

// ---------- Inicialização ----------
(function gerarCarne() {
  const params = new URLSearchParams(location.search);
  const nomeAluno = params.get('aluno');
  const anoParam = +(params.get('ano') || new Date().getFullYear());

  const infoAluno = document.getElementById('infoAluno');
  const infoSub = document.getElementById('infoSub');
  const container = document.getElementById('paginas');

  // Sem parâmetro: erro amigável
  if (!nomeAluno) {
    infoAluno.textContent = 'Aluno não informado';
    infoSub.textContent = 'Abra o carnê pela aba Financeiro do painel admin.';
    container.innerHTML = `<div style="max-width:210mm;margin:20px auto;padding:24px;background:#fef3c7;border-left:4px solid #f59e0b;border-radius:8px;color:#92400e;">
      <strong style="display:block;font-size:15px;margin-bottom:6px;">Nenhum aluno especificado</strong>
      Use o botão <strong>Imprimir carnê</strong> na aba Financeiro do painel admin para abrir esta página com os dados corretos.
    </div>`;
    return;
  }

  const alunos = lerDB('alunos');
  const aluno = alunos.find(a => a.nome === nomeAluno);

  if (!aluno) {
    infoAluno.textContent = 'Aluno não encontrado';
    infoSub.textContent = nomeAluno;
    container.innerHTML = `<div style="max-width:210mm;margin:20px auto;padding:24px;background:#fee2e2;border-left:4px solid #ef4444;border-radius:8px;color:#991b1b;">
      <strong style="display:block;font-size:15px;margin-bottom:6px;">Aluno não encontrado no banco local</strong>
      O aluno <strong>${nomeAluno}</strong> não existe no <code>localStorage</code> deste navegador.
      Cadastre-o no painel admin primeiro.
    </div>`;
    return;
  }

  // Pagamentos do aluno no ano
  const pagamentos = lerDB('pagamentos')
    .filter(p => p.aluno === aluno.nome && p.ano === anoParam)
    .sort((a, b) => a.mes - b.mes);

  // Plano
  const plano = lerDB('planos').find(p => p.nome === aluno.plano);
  const valorPadrao = plano ? plano.valor : 0;

  // Se não há pagamentos, gera 12 parcelas virtuais
  let parcelas;
  if (pagamentos.length) {
    parcelas = pagamentos;
  } else {
    parcelas = [];
    for (let m = 1; m <= 12; m++) {
      parcelas.push({
        mes: m,
        valor: valorPadrao,
        vencimento: `${String(aluno.vencimento).padStart(2,'0')}/${String(m).padStart(2,'0')}/${anoParam}`,
        status: 'Pendente'
      });
    }
  }

  // Cabeçalho
  infoAluno.textContent = 'Carnê — ' + aluno.nome;
  infoSub.textContent = `${aluno.turma} · ${aluno.plano} · Ano ${anoParam} · ${parcelas.length} parcela(s)`;

  // Renderização em folhas de 6
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const total = parcelas.length;

  for (let i = 0; i < parcelas.length; i += 6) {
    const bloco = parcelas.slice(i, i + 6);
    const folha = document.createElement('div');
    folha.className = 'folha';

    folha.innerHTML = bloco.map((p, idx) => {
      const numero = i + idx + 1;
      const numeroFmt = String(numero).padStart(2, '0');
      const totalFmt = String(total).padStart(2, '0');
      const valor = p.valor || valorPadrao;
      const venc = p.vencimento || `${String(aluno.vencimento).padStart(2,'0')}/${String(p.mes).padStart(2,'0')}/${anoParam}`;
      const mesNome = meses[(p.mes || 1) - 1] || '';

      return `
      <div class="carne">
        <div class="canhoto">
          <div class="topo"><span>CANHOTO</span><span class="badge">${numeroFmt}/${totalFmt}</span></div>
          <div class="campo"><label>Aluno(a):</label><div class="linha"></div></div>
          <div class="campo"><label>Vencimento:</label>
            <div class="data-linha"><div class="linha"></div><span>/</span><div class="linha"></div><span>/</span><div class="linha"></div></div>
          </div>
          <div class="campo"><label>Valor (R$):</label><div class="linha"></div></div>
          <div class="campo"><label>Data pagamento:</label>
            <div class="data-linha"><div class="linha"></div><span>/</span><div class="linha"></div><span>/</span><div class="linha"></div></div>
          </div>
          <div class="campo"><label>Visto / Assinatura:</label><div class="linha"></div></div>
        </div>

        <div class="via">
          <div class="cabecalho">
            <span class="titulo">${ICONE_ESCOLA} TRÍADE CONEXÃO | Reforço Escolar</span>
            <span class="parcela-tag">PARCELA ${numeroFmt}/${totalFmt}</span>
          </div>

          <div class="corpo">
            <div class="col-esq">
              <div class="campo">
                <label>Nome do aluno(a):</label>
                <div class="valor-preenchido">${aluno.nome}</div>
              </div>
              <div class="campo">
                <label>Responsável:</label>
                <div class="valor-preenchido">${aluno.responsavel || '—'}</div>
              </div>
            </div>

            <div class="col-dir">
              <div class="caixa">
                <label>${ICONE_CALENDARIO} Vencimento — ${mesNome}</label>
                <div class="valor-preenchido">${venc}</div>
              </div>
              <div class="caixa destaque">
                <label>${ICONE_DINHEIRO} Valor da mensalidade</label>
                <div class="valor-preenchido">${fmtMoeda(valor)}</div>
              </div>
            </div>
          </div>

          <div class="recebido">
            <span class="label">Recebido por:</span><div class="linha"></div>
            <span class="label">Data:</span><div class="linha" style="max-width:50px;"></div>
            <span class="check">${ICONE_CHECK} OK</span>
          </div>

          <div class="aviso">${ICONE_INFO} Pagamento até o vencimento. Em caso de dúvidas ou imprevistos, fale conosco.</div>
        </div>
      </div>`;
    }).join('');

    container.appendChild(folha);
  }
})();
</script>

</body>
</html>
